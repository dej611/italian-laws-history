[package]
name = "italian-laws-history"
version = "0.1.0"
edition = "2021"
description = "Track Italian law changes via Gazzetta Ufficiale and Normattiva, recording each modification as a git commit (Rust port)."
license = "MIT"
publish = false

[[bin]]
name = "italian-laws-history"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
governor = "0.6"
moka = { version = "0.12", features = ["sync"] }
num_cpus = "1"
nonzero_ext = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-chrome = "0.7"

tempfile = "3"
httpdate = "1"
crossterm = "0.27"
ratatui = "0.26"

[features]
cpuprofile = ["dep:pprof"]

[dependencies.pprof]
version = "0.13"
optional = true
default-features = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
