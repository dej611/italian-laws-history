# GitHub schedules this file from the default branch (`history`).
# The job checks out `main` for the scraper source.
name: Daily Normattiva Scrape

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch data branches
        run: |
          # Tip only. The scraper commits onto the current tree; it does not
          # walk ancestry. A full fetch of this orphan branch exceeds the job.
          git fetch --depth=1 --no-tags origin \
            history:refs/remotes/origin/history \
            'refs/heads/dl/*:refs/remotes/origin/dl/*' \
            'refs/heads/rdl/*:refs/remotes/origin/rdl/*' \
            'refs/heads/dll/*:refs/remotes/origin/dll/*' \
            'refs/heads/dlcps/*:refs/remotes/origin/dlcps/*'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - run: ./target/release/italian-laws-history --ci

      - name: Publish checkpoint
        run: |
          set -euo pipefail
          git add progress-rs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m ":bookmark: checkpoint"
          git fetch origin main
          git rebase origin/main
          git push origin main
